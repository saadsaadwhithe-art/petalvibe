<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetalVibe | Handcrafted Resin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            border-bottom: 2px solid #d4af37;
        }
        header h1 {
            font-size: 2.5rem;
            color: #d4af37;
            margin-bottom: 10px;
        }
        header p {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #d4af37;
            color: #121212;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #f39c12;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-title {
            text-align: center;
            color: #d4af37;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 15px;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #fff;
        }
        .card .price {
            color: #d4af37;
            font-weight: bold;
            font-size: 1.1rem;
        }
        footer {
            text-align: center;
            padding: 30px;
            background-color: #0a0a0a;
            color: #777;
            margin-top: 50px;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <h1>PetalVibe</h1>
        <p>Every Nature, Keeps Memories.</p>
        <a href="#products" class="btn">Order Now</a>
    </header>

    <div class="container" id="products">
        <h2 class="section-title">تشكيلة القلائد الفنية</h2>
        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=500&q=80" alt="قلادة زهرة عباد الشمس">
                <h3>قلادة عباد الشمس</h3>
                <div class="price">150.00 درهم</div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=500&q=80" alt="قلادة كريستال">
                <h3>قلادة الكريستال الملكي</h3>
                <div class="price">180.00 درهم</div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1611591475260-3162b77fc16f?auto=format&fit=crop&w=500&q=80" alt="قلادة الطبيعة">
                <h3>قلادة أوراق الشجر</h3>
                <div class="price">130.00 درهم</div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 PetalVibe - صنع باحترافية وعناية.</p>
    </footer>

</body>
</html>
